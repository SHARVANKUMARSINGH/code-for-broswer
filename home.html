<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoxBrowser GX Start</title>
    <style>
        :root { --neon: #00ffff; --bg: #0f0f12; --card: #1a1a20; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #2a2a35 0%, var(--bg) 60%);
            color: white; font-family: 'Segoe UI', sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        
        /* Main Title with Glow */
        h1 {
            font-size: 4rem; margin: 0; letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        
        p { color: #888; margin-bottom: 40px; }

        /* Search Box */
        .search-container {
            position: relative; width: 600px; max-width: 90%;
        }
        input {
            width: 100%; padding: 15px 25px;
            border-radius: 50px; border: 2px solid #333;
            background: rgba(255, 255, 255, 0.05);
            color: white; font-size: 1.2rem; outline: none;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        /* Speed Dial Grid */
        .grid {
            display: flex; gap: 20px; margin-top: 50px;
        }
        .card {
            background: var(--card);
            width: 110px; height: 110px;
            border-radius: 15px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            border: 1px solid transparent;
            text-decoration: none; color: white;
        }
        .card:hover {
            border-color: var(--neon);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        /* SVG Styling */
        .card svg {
            width: 40px;
            height: 40px;
            fill: white; /* Default color */
            transition: 0.3s;
            margin-bottom: 8px;
        }
        
        .card:hover svg {
            fill: var(--neon); /* Glows Cyan on hover */
            filter: drop-shadow(0 0 5px var(--neon));
        }

        .card div { font-size: 13px; color: #aaa; font-weight: 600; }

    </style>
</head>
<body>

    <h1>VANTA </h1>
    <p>GAMING EDITION //USING GOGGLE SCARCH</p>

    <div class="search-container">
        <input type="text" id="box" placeholder="Search Google or enter URL..." autofocus>
    </div>

        </a>
    </div>

    <script>
        const input = document.getElementById('box');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                // Smart Search Logic
                if (val.includes('.') && !val.includes(' ')) {
                    if (!val.startsWith('http')) val = 'https://' + val;
                    window.location.href = val;
                } else {
                    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                }
            }
        });
    </script>
</body>
</html>
